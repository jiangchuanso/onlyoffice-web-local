name: Deploy to GitHub Pages and Release

on:
  push:
    branches:
      - main

# GITHUB_TOKEN 默认只有 Contents: read，推送 gh-pages 分支与创建 Release 需要写权限
permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Ensure offline assets
        run: |
          if [ ! -d public/vendor ]; then
            echo "::error::缺少 public/vendor，请确认离线资源已提交。"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Zip build output
        run: zip -r html.zip html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./html

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: release-${{ github.run_number }}
          name: Release ${{ github.run_number }}
          body: |
            Auto-built from commit ${{ github.sha }} (main).
            Download `html.zip` and extract to any static server.
          files: html.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
